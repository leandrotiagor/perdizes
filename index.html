<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demandas do sistema de saúde de Perdizes</title>
<meta name="description" content="Acompanhamento das demandas do sistema de saúde de Perdizes (MG): pedidas, entregues e em andamento.">
<style id="css">
:root{--bg:#f4f6f7;--cd:#fff;--tx:#2c3e50;--mu:#7f8c8d;--ln:#d5dbdb;--dk:#34495e;--tl:#0f766e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17202a;--cd:#212f3d;--tx:#ecf0f1;--mu:#aab7b8;--ln:#3b4d5e;--dk:#0e1620}}
:root[data-theme="dark"]{--bg:#17202a;--cd:#212f3d;--tx:#ecf0f1;--mu:#aab7b8;--ln:#3b4d5e;--dk:#0e1620}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
header{border-bottom:1px solid var(--ln);background:var(--cd)}
.in{max-width:1200px;margin:0 auto;padding:clamp(24px,5vw,56px) 16px clamp(18px,3vw,32px);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font:700 clamp(30px,5vw,52px)/1.06 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:-.02em;margin:0 0 12px;max-width:16em}
.lead{margin:0;color:var(--mu);font-size:clamp(15px,1.6vw,18px);max-width:52ch}header small{color:var(--mu)}
main{max-width:1200px;margin:0 auto;padding:16px}
#msg{margin:0 0 12px;padding:10px 12px;border-radius:6px;background:var(--cd);border-left:4px solid #3498db}#msg:empty{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.k{background:var(--cd);border-radius:8px;padding:12px;border-top:4px solid var(--dk);text-align:center}
.k b{display:block;font-size:26px}.k span{font-size:11px;color:var(--mu);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:12px 0}
.c{background:var(--cd);border-radius:8px;padding:12px;min-width:0}.c h2{font-size:14px;margin:0 0 8px}
.c div{position:relative;height:250px}
.f{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.f input,.f select{padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--cd);color:var(--tx)}.f input{flex:1;min-width:180px}
.t{overflow-x:auto;background:var(--cd);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:top}
th{background:var(--dk);color:#fff}tr{cursor:pointer}
.d{color:var(--mu);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}tr.o .d{display:block}
.s{border-radius:10px;padding:2px 9px;font-size:12px;color:#fff;white-space:nowrap}
#gate{display:none}body.locked header,body.locked main{display:none}
body.locked #gate{display:grid;place-items:center;min-height:100vh;padding:16px}
#lf{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:28px;width:min(380px,100%);display:grid;gap:14px;box-shadow:0 24px 60px -24px rgba(10,20,28,.4)}
#lf h2{margin:0;font:700 28px/1.1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}#lf p{margin:0;color:var(--mu)}
#lf label{display:grid;gap:6px;font-weight:600}#lf input{padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
#lf button{padding:11px;border:0;border-radius:8px;background:var(--tl);color:#fff;font:inherit;font-weight:700;cursor:pointer}
#lf input:focus-visible,#lf button:focus-visible{outline:3px solid var(--tl);outline-offset:2px}#err{color:#c0392b;min-height:1.4em}
</style></head><body class="locked">

<label>Senha<input id="p" type="password" autocomplete="current-password" required></label>
<button type="submit">Entrar</button><p id="err" role="alert"></p></form></div>

<script id="code">
const $=s=>document.querySelector(s),fm=s=>s?s.split('-').reverse().join('/'):'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL={'Solucionado':'#27ae60','Pendente':'#f39c12','Em análise':'#3498db'};
const stt=v=>/^pend/i.test(v)?'Pendente':/an[aá]lise/i.test(v)?'Em análise':/solu/i.test(v)?'Solucionado':'';
const ser=v=>{if(v===''||v==null)return '';if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
 const a=String(v).match(/(\d{2})\/(\d{2})\/(\d{4})/);if(a)return a[3]+'-'+a[2]+'-'+a[1];const b=String(v).match(/^\d{4}-\d{2}-\d{2}/);return b?b[0]:''};
const dd=r=>r.s==='Solucionado'&&r.p&&r.e?Math.round((Date.parse(r.e)-Date.parse(r.p))/864e5):null;
let D,CH=[];const BL=JSON.parse($('#dados').textContent);
function render(){
 CH.forEach(c=>c.destroy());CH=[];
 const R=D.rows,n=s=>R.filter(r=>r.s===s).length,tot=R.length,sol=n('Solucionado'),pen=n('Pendente'),ana=n('Em análise');
 const ds=R.map(dd).filter(x=>x!==null&&x>=0).sort((a,b)=>a-b),L=ds.length;
 const med=L?(L%2?ds[(L-1)/2]:(ds[L/2-1]+ds[L/2])/2):0,avg=L?ds.reduce((a,b)=>a+b,0)/L:0;
 const f1=x=>x.toFixed(1).replace('.',',');
 const k=(v,l,c)=>`<div class="k" style="border-top-color:${c||'var(--dk)'}"><b style="color:${c||'inherit'}">${v}</b><span>${l}</span></div>`;
 $('#upd').textContent='Atualizado em '+fm(D.upd);
 $('#app').innerHTML=`<div class="kpis">${k(tot,'Total')}${k(sol,'Solucionadas','#27ae60')}${k(pen,'Pendentes','#f39c12')}${k(ana,'Em análise','#3498db')}${k(tot?f1(sol/tot*100)+'%':'0%','Resolvidas')}${k(f1(avg),'Tempo médio (dias)')}${k(f1(med),'Tempo mediano (dias)')}</div>
 <div class="grid"><div class="c"><h2>Status</h2><div><canvas id="c1"></canvas></div></div><div class="c"><h2>Demandas por módulo</h2><div><canvas id="c2"></canvas></div></div><div class="c"><h2>Pedidas x entregues por mês</h2><div><canvas id="c3"></canvas></div></div><div class="c"><h2>Tempo de entrega (dias)</h2><div><canvas id="c4"></canvas></div></div></div>
 <div class="f"><input id="q" placeholder="Buscar por número, título ou descrição"><select id="fs"><option value="">Todos os status</option>${Object.keys(COL).map(s=>`<option>${s}</option>`).join('')}</select><select id="fm"><option value="">Todos os módulos</option>${D.mods.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div>
 <p id="cnt"></p><div class="t"><table><thead><tr><th>Nº</th><th>Demanda</th><th>Módulo</th><th>Status</th><th>Pedido</th><th>Entrega</th><th>Dias</th></tr></thead><tbody id="tb"></tbody></table></div>`;
 Chart.defaults.color=getComputedStyle(document.documentElement).getPropertyValue('--mu').trim()||'#7f8c8d';
 const mk=(id,cfg)=>{cfg.options=Object.assign({responsive:true,maintainAspectRatio:false},cfg.options);CH.push(new Chart($(id),cfg))};
 mk('#c1',{type:'doughnut',data:{labels:Object.keys(COL),datasets:[{data:[sol,pen,ana],backgroundColor:Object.values(COL),borderWidth:0}]},options:{plugins:{legend:{position:'right'}}}});
 mk('#c2',{type:'bar',data:{labels:D.mods,datasets:Object.keys(COL).map(s=>({label:s,data:D.mods.map(m=>R.filter(r=>r.m===m&&r.s===s).length),backgroundColor:COL[s]}))},options:{indexAxis:'y',scales:{x:{stacked:true},y:{stacked:true}},plugins:{legend:{position:'bottom'}}}});
 const ks=[...R.map(r=>r.p),...R.map(r=>r.e)].filter(Boolean).map(x=>x.slice(0,7)).sort(),ms=[];
 if(ks.length){let [y,m]=ks[0].split('-').map(Number);const [y2,m2]=ks[ks.length-1].split('-').map(Number);while(y<y2||(y===y2&&m<=m2)){ms.push(y+'-'+String(m).padStart(2,'0'));if(++m>12){m=1;y++}}}
 const cm=(a,q)=>R.filter(r=>r[a]&&r[a].slice(0,7)===q).length;
 mk('#c3',{type:'bar',data:{labels:ms.map(q=>q.slice(5)+'/'+q.slice(0,4)),datasets:[{label:'Pedidas',data:ms.map(q=>cm('p',q)),backgroundColor:'#5d7a96'},{label:'Entregues',data:ms.map(q=>cm('e',q)),backgroundColor:'#27ae60'}]},options:{plugins:{legend:{position:'bottom'}}}});
 const B=[['Mesmo dia',0,0],['1 dia',1,1],['2 a 3',2,3],['4 a 7',4,7],['8 a 30',8,30],['Mais de 30',31,1e9]];
 mk('#c4',{type:'bar',data:{labels:B.map(b=>b[0]),datasets:[{label:'Demandas',data:B.map(b=>ds.filter(x=>x>=b[1]&&x<=b[2]).length),backgroundColor:'#3498db'}]},options:{plugins:{legend:{display:false}}}});
 const draw=()=>{const q=$('#q').value.toLowerCase(),s=$('#fs').value,m=$('#fm').value;
  const T=[...R].sort((a,b)=>b.n-a.n).filter(r=>(!s||r.s===s)&&(!m||r.m===m)&&(!q||(r.n+' '+r.t+' '+r.d).toLowerCase().includes(q)));
  $('#cnt').textContent=T.length+' de '+tot+' demandas';
  $('#tb').innerHTML=T.map(r=>{const d=dd(r);return `<tr><td>${r.n}</td><td><b>${esc(r.t)}</b><div class="d">${esc(r.d)}</div></td><td>${esc(r.m)}</td><td><span class="s" style="background:${COL[r.s]||'#7f8c8d'}">${esc(r.s)}</span></td><td>${fm(r.p)}</td><td>${fm(r.e)}</td><td>${d===null?'':d}</td></tr>`}).join('')};
 ['#q','#fs','#fm'].forEach(i=>$(i).addEventListener('input',draw));
 $('#tb').addEventListener('click',e=>{const t=e.target.closest('tr');if(t)t.classList.toggle('o')});
 draw();
}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(cred){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(cred),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BL.s),iterations:BL.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BL.i)},key,b64(BL.c));
 D=JSON.parse(new TextDecoder().decode(pt));document.body.classList.remove('locked');render();
}
$('#lf').addEventListener('submit',async e=>{e.preventDefault();
 const c=$('#u').value.trim().toLowerCase()+':'+$('#p').value;
 if(!(window.crypto&&crypto.subtle)){$('#err').textContent='Abra o site por HTTPS para entrar.';return}
 try{await unlock(c);try{sessionStorage.setItem('k',c)}catch(x){}}catch(x){$('#err').textContent='Usuário ou senha incorretos.';$('#p').value=''}});
try{const k0=sessionStorage.getItem('k');if(k0&&window.crypto&&crypto.subtle)unlock(k0).catch(()=>sessionStorage.removeItem('k'))}catch(x){}
