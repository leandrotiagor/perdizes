<style id="css">

body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
header{border-bottom:1px solid var(--ln);background:var(--cd)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

th{background:var(--dk);color:#fff}tr{cursor:pointer}
.d{color:var(--mu);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}tr.o .d{display:block}
.s{border-radius:10px;padding:2px 9px;font-size:12px;color:#fff;white-space:nowrap}
#gate{display:none}body.locked header,body.locked main{display:none}
body.locked #gate{display:grid;place-items:center;min-height:100vh;padding:16px}
#lf{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:28px;width:min(380px,100%);display:grid;gap:14px;box-shadow:0 24px 60px -24px rgba(10,20,28,.4)}
#lf h2{margin:0;font:700 28px/1.1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}#lf p{margin:0;color:var(--mu)}

2026-09-14","m":"CAPS"},{"n":24,"t":"Novo Acolhimento RAAS - Evolução do acolhimento e campo PTS","d":"Criar botão para 'Evolução do Acolhimento' e campo para 'PTS' (Projeto Terapêutico Singular).","s":"Solucionado","p":"2026-08-31","e":"2026-09-14","m":"CAPS"},{"n":25,"t":"Prontuário - Impressão completa do prontuário do paciente","d":"Criar opção/local específico para a impressão de todas as informações do paciente disponíveis no sistema.","s":"Solucionado","p":"2026-08-31","e":"2026-09-14","m":"CAPS"},{"n":26,"t":"Registro de faltas em oficinas e atendimentos","d":"Criar funcionalidade para registrar a falta do paciente sem ser considerada evolução clínica.","s":"Solucionado","p":"2026-08-31","e":"2026-09-14","m":"CAPS"},{"n":27,"t":"Acolhimento - Identificação de paciente judicial","d":"Adicionar opção para sinalizar 'Paciente Judicial' no acolhimento, exibindo alerta nos próximos atendimentos.","s":"Solucionado","p":"2026-08-31","e":"2026-09-14","m":"CAPS"},{"n":28,"t":"Central de Pedidos - Visualização do estoque pelo Almoxarifado","d":"Criar permissão para usuários do Almoxarifado visualizarem o estoque das demais unidades.","s":"Solucionado","p":"2026-09-01","e":"2026-09-01","m":"Farmácia e Almoxarifado"},{"n":29,"t":"Dispensação - Informar motivo ao remover medicamento","d":"Solicitar e registrar o motivo sempre que um medicamento for removido do grid da dispensação.","s":"Solucionado","p":"2026-09-01","e":"2026-09-01","m":"Farmácia e Almoxarifado"},{"n":30,"t":"Ajuste de Estoque - Permitir edição dos produtos diretamente no grid","d":"Permitir a edição das informações (Lote, Qtd, etc.) diretamente no grid, sem necessidade de excluir o lançamento.","s":"Solucionado","p":"2026-09-01","e":"2026-09-01","m":"Farmácia e Almoxarifado"},{"n":31,"t":"Ajuste de Estoque - Permitir continuar a edição após salvar","d":"Permitir que um ajuste de estoque já salvo seja reaberto, editado e complementado sem perder os dados.","s":"Solucionado","p":"2026-09-01","e":"2026-09-01","m":"Farmácia e Almoxarifado"},{"n":32,"t":"Cadastro de Profissionais - Inativação ou exclusão por CRM incorreto","d":"Possibilitar a inativação ou exclusão de cadastros de profissionais realizados com CRM incorreto/duplicado.","s":"Solucionado","p":"2026-09-01","e":"2026-09-01","m":"Secretaria de Saúde"},{"n":33,"t":"Saída Simples - Opção de impressão após salvar","d":"Disponibilizar a opção de imprimir o registro após o salvamento da saída simples.","s":"Solucionado","p":"2026-09-01","e":"2026-09-01","m":"Farmácia e Almoxarifado"},{"n":34,"t":"Transferência - Opção de impressão após salvar","d":"Disponibilizar a opção de imprimir o registro após o salvamento da transferência.","s":"Solucionado","p":"2026-09-01","e":"2026-09-01","m":"Farmácia e Almoxarifado"},{"n":35,"t":"Dispensação - Campo livre para observações","d":"Criar um campo livre de observações na tela de Dispensação para informações adicionais (ex: quem retirou).","s":"Solucionado","p":"2026-09-01","e":"2026-09-01","m":"Farmácia e Almoxarifado"},{"n":36,"t":"Ajuste de Estoque - Exibição incorreta da quantidade ajustada","d":"Ajustar a exibição para produtos de unidade inteira não mostrarem casas decimais (ex: 10 em vez de 10,000).","s":"Solucionado","p":"2026-09-01","e":"2026-09-01","m":"Farmácia e Almoxarifado"},{"n":37,"t":"Controle de Empréstimo de Oxigênio — Gestão de materiais, empréstimos, devoluções e trocas","d":"Criar um novo módulo para controle completo de materiais de oxigênio (entrada, empréstimo, recarga, devolução, troca e termo de empréstimo), mantendo o histórico de movimentação por paciente.","s":"Em análise","p":"2026-09-03","e":"","m":"Secretaria de Saúde"},{"n":38,"t":"Gerenciar Permissões por Perfil — Exibir apenas o perfil selecionado e padronizar a identificação dos módulos e telas","d":"Exibir apenas o perfil selecionado na tela de permissões e organizar as permissões de forma hierárquica (módulo -> tela) utilizando a nomenclatura exata do sistema.","s":"Solucionado","p":"2026-09-16","e":"2026-09-16","m":"Secretaria de Saúde"},{"n":39,"t":"Pedido de Ressuprimento — Permitir atendimento com quantidade superior à solicitada","d":"Permitir que o Almoxarifado informe uma quantidade atendida superior à quantidade solicitada pela unidade no pedido de ressuprimento.","s":"Solucionado","p":"2026-09-16","e":"2026-09-16","m":"Farmácia e Almoxarifado"},{"n":40,"t":"Recepção CAPS — Profissional do atendimento deve corresponder ao usuário logado ou permitir seleção","d":"Corrigir o sistema para vincular o atendimento automaticamente ao profissional logado ou permitir a seleção manual, evitando atribuição incorreta de um profissional fixo.","s":"Solucionado","p":"2026-09-16","e":"2026-09-17","m":"CAPS"},{"n":41,"t":"Grupos Terapêuticos — Profissional da evolução sendo preenchido incorretamente","d":"Corrigir a vinculação automática do profissional na evolução dos pacientes, utilizando o profissional logado ou permitindo a seleção.","s":"Solucionado","p":"2026-09-16","e":"2026-09-17","m":"CAPS"},{"n":42,"t":"Pedido de Ressuprimento — Visualização dos itens dos pedidos anteriores","d":"Adicionar uma opção para visualizar os detalhes (produtos, quantidades solicitadas/atendidas, status) dos pedidos de ressuprimento realizados anteriormente.","s":"Solucionado","p":"2026-09-16","e":"2026-09-17","m":"Farmácia e Almoxarifado"},{"n":43,"t":"Link Externo via QR Code — Envio automático das fotos e aumento do limite de anexos","d":"Alterar o fluxo para envio automático da foto após clicar em 'Usar Foto' e aumentar ou remover o limite atual de 20 fotos por atendimento.","s":"Solucionado","p":"2026-09-16","e":"2026-09-17","m":"Geral"},{"n":44,"t":"Prescrição Médica — Replicar/Renovar prescrição anterior","d":"Adicionar opção para replicar/renovar uma prescrição anterior, carregando os dados da existente para gerar uma nova com a data atual.","s":"Solucionado","p":"2026-09-16","e":"2026-09-17","m":"CAPS"},{"n":45,"t":"Atendimento — Preenchimento automático do pro cionar opção \"Cancelar Recepção\" para retornar o paciente à fila de aguardando e corrigir recepções realizadas incorretamente.","s":"Solucionado","p":"2026-09-24","e":"2026-09-24","m":"CAPS"},{"n":109,"t":"Recepção de Agendados CAPS — Marcar falta manualmente","d":"Adicionar botão \"Marcar Falta\" ao lado de \"Recepcionar\" para registrar o não comparecimento e remover o paciente da lista de espera.","s":"Solucionado","p":"2026-09-24","e":"2026-09-24","m":"CAPS"},{"n":110,"t":"Estoque Mínimo — Configurar quantidade mínima por produto da unidade","d":"Permitir configurar uma quantidade mínima de estoque por produto para cada unidade e destacar visualmente os itens que atingirem esse limite.","s":"Solucionado","p":"2026-09-24","e":"2026-09-24","m":"Farmácia e Almoxarifado"},{"n":111,"t":"Portal da Transparência - Apresentar somente a medicação básica","d":"Restringir a consulta do Portal da Transparência para exibir exclusivamente os medicamentos listados como Medicação Básica, ocultando os demais.","s":"Pendente","p":"2026-09-24","e":"","m":"Secretaria de Saúde"},{"n":112,"t":"Cadastro de Produtos — Botão para inativar produto na listagem","d":"Adicionar botão \"Inativar\" diretamente na listagem de produtos, sem precisar abrir os detalhes do cadastro, mantendo confirmação e histórico.","s":"Solucionado","p":"2026-09-24","e":"2026-09-24","m":"Farmácia e Almoxarifado"},{"n":113,"t":"Nova Dispensação — Exibir histórico de dispensações anteriores do paciente","d":"Exibir o histórico das dispensações anteriores automaticamente abaixo dos dados do paciente logo após ele ser selecionado na tela.","s":"Solucionado","p":"2026-09-24","e":"2026-09-24","m":"Farmácia e Almoxarifado"},{"n":114,"t":"Central de Pedidos - Almoxarifado permitir acrescentar itens durante o atendimento","d":"Permitir ao Almoxarifado usar a opção \"Adicionar Item\" para incluir produtos não solicitados originalmente durante o atendimento do pedido.","s":"Solucionado","p":"2026-09-24","e":"2026-09-24","m":"Farmácia e Almoxarifado"},{"n":115,"t":"Estoque das Unidades - Relatório visual consolidado","d":"Criar relatório consolidado com botão de impressão para visualizar e comparar simultaneamente o estoque de várias unidades sem precisar trocar de unidade.","s":"Solucionado","p":"2026-09-24","e":"2026-09-24","m":"Farmácia e Almoxarifado"},{"n":116,"t":"Regulação — Remover obrigatoriedade de três palavras na solicitação","d":"Remover a regra que exige no mínimo três palavras no campo da solicitação de Regulação, mantendo apenas a obrigatoriedade de preenchimento.","s":"Solucionado","p":"2026-09-24","e":"2026-09-24","m":"Regulação"},{"n":117,"t":"Criação de Agenda da Regulação — Número da consulta","d":"Adicionar campo opcional \"Número da Consulta\" para cada vaga/horário criado e exibir essa informação no Relatório de Pacientes Agendados.","s":"Solucionado","p":"2026-09-24","e":"2026-09-24","m":"Regulação"},{"n":118,"t":"Relatório de Pacientes para Renovação de Receita","d":"Criar relatório filtrável (período e unidade) com botão de impressão para listar pacientes que precisam de renovação de receita, obtendo os dados do PEC.","s":"Solucionado","p":"2026-09-24","e":"2026-09-30","m":"Farmácia e Almoxarifado"},{"n":119,"t":"Estoque das Unidades — Opção para selecionar/desmarcar unidades","d":"Adicionar as opções \"Selecionar Todas\" e \"Desmarcar Todas\" no filtro de unidades do relatório para facilitar consultas específicas.","s":"Solucionado","p":"2026-09-27","e":"2026-09-27","m":"Farmácia e Almoxarifado"},{"n":120,"t":"Parâmetros de Estoque — Permitir somente quantidades inteiras","d":"Restringir o campo de quantidade para aceitar apenas números inteiros, bloqueando a inserção de valores fracionados (ex: 49,999 ou 50,25).","s":"Solucionado","p":"2026-09-27","e":"2026-09-27","m":"Farmácia e Almoxarifado"},{"n":121,"t":"Evolução do Acolhimento — Permitir edição pelo próprio operador por até 24 horas","d":"Permitir que apenas o operador que registrou a evolução possa editá-la dentro de um prazo limite de 24 horas, mantendo o histórico de alterações.","s":"Solucionado","p":"2026-09-27","e":"2026-09-27","m":"CAPS"},{"n":122,"t":"Acolhimento — Permitir que qualquer profissional dê prosseguimento ao acolhimento recepcionado","d":"Permitir que qualquer profissional habilitado inicie o acolhimento de um paciente já recepcionado, sem restrição ao operador que fez a recepção, mantendo os registros de quem recepcionou e quem atendeu.","s":"Solucionado","p":"2026-09-28","e":"2026-09-30","m":"CAPS"},{"n":123,"t":"Relatório de Dispensações — Relatório geral por paciente","d":"Criar um relatório consolidado com o histórico de dispensações por paciente (data, medicamento, quantidade, unidade, operador), com opções de visualização e impressão.","s":"Solucionado","p":"2026-09-28","e":"2026-09-30","m":"Farmácia e Almoxarifado"},{"n":124,"t":"Dispensação — Registrar medicamento não disponível para dispensação","d":"Criar botão \"Medicamento Não Disponível\" para registrar a busca de um item em falta, informando o paciente (CPF), nome do medicamento (campo livre) e motivo da não dispensação.","s":"Solucionado","p":"2026-09-28","e":"2026-09-30","m":"Farmácia e Almoxarifado"},{"n":125,"t":"Novo Ajuste — Corrigir botão “Editar Produto”","d":"Desbloquear e corrigir o botão \"Editar Produto\" no \"Novo Ajuste\" para permitir alterações nos dados do produto diretamente no ajuste, sem precisar excluí-lo e adicioná-lo novamente.","s":"Solucionado","p":"2026-09-28","e":"2026-09-30","m":"Farmácia e Almoxarifado"},{"n":126,"t":"Estoque de Produtos — Corrigir filtros “Próximo ao Vencimento” e “Vencidos”","d":"Corrigir o funcionamento dos filtros para exibirem exclusivamente os produtos nas condições selecionadas, aplicando a mesma regra à listagem em tela e à impressão.","s":"Solucionado","p":"2026-09-28","e":"2026-09-30","m":"Farmácia e Almoxarifado"},{"n":127,"t":"Produtos — Informar disponibilidade de estoque da unidade logada","d":"Adicionar um indicador visual (ex: \"Com estoque\" ou \"Sem estoque\") ao lado de cada produto na listagem, considerando exclusivamente a disponibilidade na unidade em que o operador está logado.","s":"Solucionado","p":"2026-09-28","e":"2026-09-30","m":"Farmácia e Almoxarifado"},{"n":128,"t":"Reimpressão de Receitas — Selecionar princípios para impressão","d":"Ao clicar em \"Reimprimir Receita\", abrir um checklist com os princípios ativos da receita (com opção \"Selecionar todos\") e imprimir somente os selecionados, mantendo os demais dados da receita.","s":"Solucionado","p":"2026-10-05","e":"2026-10-06","m":"Farmácia e Almoxarifado"},{"n":129,"t":"Receita CAPS — Definir quantidade de comprimidos por turno","d":"Permitir informar a quantidade de comprimidos para cada turno selecionado (ex: manhã 1, noite 2), calculando o total diário e o total da receita pelo período de tratamento, para uso na compra e dispensação.","s":"Solucionado","p":"2026-10-05","e":"2026-10-06","m":"CAPS"},{"n":130,"t":"Transferência — Permitir edição dos produtos após o salvamento","d":"Ao clicar em \"Editar\" em uma transferência salva, permitir alterar os produtos e quantidades já lançados (ex: 5 para 3 unidades), mantendo o histórico/auditoria das alterações.","s":"Solucionado","p":"2026-10-05","e":"2026-10-06","m":"Farmácia e Almoxarifado"},{"n":131,"t":"Medicamento Não Disponível — Justificativas múltiplas e observação","d":"Substituir a justificativa livre por checklist (não padronizado, necessita cadastro da assistente social, aguardando fornecedor) com seleção de uma ou mais opções, ao menos uma obrigatória, e campo \"Observação\" opcional vinculado ao registro.","s":"Solucionado","p":"2026-10-05","e":"2026-10-06","m":"Farmácia e Almoxarifado"},{"n":132,"t":"Relatório de Medicamentos Não Disponíveis — Filtros por justificativa, usuário e período","d":"Criar relatório dos registros de \"Medicamento Não Disponível\" com filtros por justificativa(s), usuário/paciente e período, exibindo paciente, medicamento, justificativas, observação, data e operador, com impressão respeitando os filtros.","s":"Solucionado","p":"2026-10-05","e":"2026-10-06","m":"Secretaria de Saúde"},{"n":133,"t":"Alocação de Transportes — Preenchimento automático do período","d":"Ao acessar a tela, preencher automaticamente Data Inicial e Data Final com a data atual, mantendo a possibilidade de o operador alterá-las manualmente.","s":"Solucionado","p":"2026-10-07","e":"2026-10-08","m":"Frotas"},{"n":134,"t":"Alocação de Transportes — Padronizar campo \"Onde buscar\" no passageiro manual","d":"Substituir o campo livre por opções predefinidas (Secretaria Municipal de Saúde, Rodoviária Antiga, Ponto de Ônibus (Zé Galinha), Comercial Perdigueira, Praça do Morada Nova e Outro). Ao escolher \"Outro\", abrir campo de texto; o local deve aparecer na alocação e no mapa do motorista.","s":"Solucionado","p":"2026-10-07","e":"2026-10-08","m":"Frotas"},{"n":135,"t":"Mapa do Motorista — Cabeçalho na impressão","d":"Acrescentar na impressão um cabeçalho padronizado com o logo do município, \"Secretaria Municipal de Saúde de Perdizes\" e o título \"LISTA DE VIAGENS\".","s":"Solucionado","p":"2026-10-07","e":"2026-10-08","m":"Frotas"},{"n":136,"t":"Mapa do Motorista — Identificação de embarque","d":"Trocar a coluna \"EMBARCOU\" (um quadrado) por \"EMBARQUE\" com duas opções, SIM e NÃO, para o motorista marcar manualmente a caneta se o paciente embarcou ou não.","s":"Solucionado","p":"2026-10-07","e":"2026-10-08","m":"Frotas"},{"n":137,"t":"Liberação de Uso — Exibir última atualização do PEC e unidade de referência","d":"Ao localizar o paciente pelo nome, exibir também a data da última atualização no PEC e a unidade de referência, usando os mesmos dados da busca do próprio PEC.","s":"Solucionado","p":"2026-10-07","e":"2026-10-08","m":"Secretaria de Saúde"},{"n":138,"t":"Entrada por Nota — Permitir edição para acrescentar produtos","d":"Incluir a opção \"Editar\" em entradas já salvas, permitindo acrescentar produtos faltantes (com quantidade e demais dados) e manter os já lançados, sem precisar excluir e refazer a entrada.","s":"Solucionado","p":"2026-10-07","e":"2026-10-08","m":"Farmácia e Almoxarifado"},{"n":139,"t":"Nova Dispensação — Liberação de Uso por autorização física","d":"Quando o medicamento exigir Liberação de Uso e não houver cadastro, perguntar se o paciente tem autorização física da assistente social. Se \"Sim\", escanear QR Code e anexar foto, vincular ao paciente e medicamento, criar a liberação automaticamente (validade de 6 meses, com Quantidade em branco) e seguir com a dispensação. Se \"Não\", manter o fluxo atual.","s":"Solucionado","p":"2026-10-07","e":"2026-10-08","m":"Farmácia e Almoxarifado"},{"n":140,"t":"Mapa do Motorista — Espaço para pacientes excedentes","d":"No final da impressão, incluir tabela com 7 linhas em branco (Paciente, CPF, Origem, Destino) para o motorista registrar manualmente pacientes que embarcarem sem estar no mapa.","s":"Solucionado","p":"2026-10-07","e":"2026-10-08","m":"Frotas"},{"n":141,"t":"Solicitação — Remover exigência de quantidade mínima de palavras na justificativa","d":"Na Nova Solicitação, remover a validação de no mínimo 3 palavras na Justificativa, mantendo o campo obrigatório e os demais comportamentos inalterados.","s":"Solucionado","p":"2026-10-07","e":"2026-10-08","m":"Secretaria de Saúde"},{"n":142,"t":"Alocação de Transportes — Unidade de destino no passageiro manual","d":"Em \"Incluir passageiro manual\", após selecionar o município de destino, exibir automaticamente as unidades de destino cadastradas para ele, com a opção \"Outros\" que abre campo livre. A unidade escolhida ou informada fica vinculada ao passageiro e deve aparecer na impressão do Mapa do Motorista.","s":"Solucionado","p":"2026-10-07","e":"2026-10-08","m":"Frotas"},{"n":143,"t":"Recepção de Demanda — Acrescentar campos obrigatórios e anexo da solicitação física","d":"Acrescentar na tela os campos Justificativa (texto livre), Profissional solicitante (nome do médico, texto livre) e Unidade que solicitou (seleção entre as unidades de Perdizes), todos obrigatórios, além de botão de QR Code para escanear e anexar foto da solicitação física, também obrigatório. O registro só conclui com tudo preenchido e anexado.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Clínica da Mulher"},{"n":144,"t":"Recepção de Agendados — Filtrar automaticamente pela unidade de login","d":"Ao abrir a tela, selecionar automaticamente a unidade vinculada ao login do operador e exibir os agendamentos dela, permitindo trocar para outra unidade com a listagem atualizando conforme a escolha.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Clínica da Mulher"},{"n":145,"t":"Comprovante de Agendamento — Exibir o profissional agendado","d":"Incluir na impressão do comprovante o nome do profissional informado no agendamento manual, garantindo que corresponda ao profissional selecionado naquele agendamento.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Secretaria de Saúde"},{"n":146,"t":"Alocação de Transportes — Permitir editar agendamento de viagem do paciente","d":"Adicionar botão \"Editar\" para o paciente já incluído na fila, permitindo alterar \"Onde buscar\", \"Trajeto\", \"Precisa de ambulância\" e demais dados do agendamento, com as mudanças refletidas na tela e no mapa do motorista.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Frotas"},{"n":147,"t":"Alocação de Transportes — Confirmar viagem do paciente","d":"Incluir botão \"Confirmar Viagem\" por paciente da fila, para diferenciar quem já confirmou. Após confirmar, a linha muda de cor e o status é registrado; confirmados podem ser usados na alocação das viagens e os não confirmados continuam listados com identificação visual distinta.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Frotas"},{"n":148,"t":"Alocação de Transportes — Incluir acompanhante do paciente","d":"Permitir adicionar acompanhante ao paciente após entrar na fila e antes da confirmação. O acompanhante ocupa vaga no veículo (entra no cálculo de capacidade) e aparece no Mapa do Motorista abaixo do paciente, identificado como \"ACOMPANHANTE\".","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Frotas"},{"n":149,"t":"Alocação de Transportes — Filtro de pacientes confirmados e não confirmados","d":"Adicionar filtro de status de confirmação com as opções \"Todos\", \"Confirmados\" e \"Não confirmados\", aplicado à listagem para facilitar a seleção de passageiros na criação das viagens.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Frotas"},{"n":150,"t":"Alocação de Transportes — Filtro por necessidade de ambulância","d":"Adicionar filtro com as opções \"Todos\", \"Necessita de ambulância\" e \"Não necessita de ambulância\", conforme o registrado no agendamento, atualizando a listagem.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Frotas"},{"n":151,"t":"Alocação de Transportes — Informar procedimento a ser realizado na viagem","d":"Incluir, na inclusão manual de passageiros, um campo para o procedimento que o paciente fará no destino, vinculado ao paciente e à viagem e disponível para consulta e faturamento.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Frotas"},{"n":152,"t":"Alocação de Transportes — Registro de diárias de motoristas","d":"Criar botão \"Registro de Diárias\" para cadastrar motorista, veículo, percurso e quantidade de diárias, vinculando os dados. Inclui relatório semanal com filtro por data inicial e final, consulta a períodos anteriores e botão \"Imprimir\" respeitando os filtros.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Frotas"},{"n":153,"t":"Mapa do Motorista — Separar impressão por tipo de trajeto","d":"Na impressão, separar os passageiros em folhas distintas: somente IDA, IDA E VOLTA e somente VOLTA, cada uma só com os passageiros do tipo, mantendo o cabeçalho institucional e as demais informações.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Frotas"},{"n":154,"t":"Nova Solicitação — Exibir informações do paciente provenientes do PEC","d":"Ao selecionar o paciente, exibir automaticamente, antes de concluir o registro, a data da última atualização no PEC e a unidade de referência, obtidas do PEC para o paciente selecionado.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Regulação"},{"n":155,"t":"Nova Solicitação — Disponibilizar agendamento manual após salvar","d":"Após salvar a solicitação, exibir botão \"Agendamento Manual\" que abre o fluxo existente com o paciente já vinculado, sem precisar localizá-lo de novo, no mesmo comportamento do botão \"Agendar\" em Agendamento Automático → Agendamento Manual, mantendo a solicitação vinculada ao agendamento.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Regulação"},{"n":156,"t":"Dispensação — Registrar receitas de 30 ou 60 dias e controlar dispensação parcial","d":"Adicionar campo opcional \"Receita de 30 dias\" ou \"Receita de 60 dias\". Na de 60 dias, pergunta obrigatória \"Foi dispensada a quantidade referente a 60 dias?\": se Sim, segue normal e o protocolo mostra receita de 60 dias com a quantidade total; se Não, tornam-se obrigatórias a quantidade dispensada e a pendente, e o protocolo mostra \"DISPENSAÇÃO PARCIAL\" com ambas. Mantém histórico para consulta.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Farmácia e Almoxarifado"},{"n":157,"t":"Alocação de Transportes — Registrar falta do paciente na viagem","d":"Adicionar ação \"Registrar Falta\" para o paciente alocado que não compareceu, atualizando o status dele na viagem e registrando a ocorrência no histórico (data da viagem e falta). Serve só para controle e histórico, sem gerar lançamento para faturamento, e diferencia quem faltou de quem confirmou ou não confirmou a viagem.","s":"Solucionado","p":"2026-10-09","e":"2026-10-10","m":"Frotas"},{"n":158,"t":"Alocação de Transportes — Registrar paciente que não confirmou a viagem","d":"Adicionar ação \"Não Confirmou a Viagem\" por paciente, permitindo ao operador marcar quem não confirmou se irá viajar, com registro no histórico do paciente vinculado à data e à viagem correspondente, para consulta posterior.","s":"Solucionado","p":"2026-10-13","e":"2026-10-13","m":"Frotas"},{"n":159,"t":"Produtos — Filtro por medicamentos que exigem Liberação de Uso","d":"Adicionar na tela de Produtos o filtro \"Exige Liberação de Uso\" (Sim, Não, Todos), baseado na configuração cadastrada em cada produto e combinável com os demais filtros da tela.","s":"Solucionado","p":"2026-10-13","e":"2026-10-13","m":"Farmácia e Almoxarifado"},{"n":160,"t":"Relatório de Produtos Dispensados — Produtos que exigem Liberação de Uso","d":"Criar relatório dos produtos dispensados que exigem Liberação de Uso no cadastro, com filtro por mês e ano, agrupado por produto e mostrando produto, quantidade total dispensada e mês/ano. Considera só dispensações efetivamente realizadas (sem pendentes) e permite imprimir respeitando os filtros.","s":"Solucionado","p":"2026-10-13","e":"2026-10-13","m":"Farmácia e Almoxarifado"},{"n":161,"t":"Dispensação — Vincular o número da receita individualmente a cada princípio","d":"Permitir informar o número da receita individualmente para cada medicamento da mesma dispensação, possibilitando receitas diferentes para o mesmo paciente sem precisar fazer dispensações separadas. O protocolo impresso mostra o número de cada medicamento, deixando em branco os que não exigem receita (sem preencher com dados de outro), mantendo a vinculação entre medicamento, quantidade e receita e as validações atuais.","s":"Solucionado","p":"2026-10-14","e":"2026-10-19","m":"Farmácia e Almoxarifado"},{"n":162,"t":"Parametrização de Laudos — Configurar laudos padrão por procedimento de ultrassonografia","d":"Criar tela restrita por permissão para cadastrar e editar laudos padrão por procedimento do grupo \"Ultrassonografias\". Ao abrir o laudo do exame, o sistema preenche o texto padrão do procedimento (ou deixa em branco se não houver); o médico pode editar livremente sem alterar o modelo cadastrado.","s":"Solucionado","p":"2026-10-14","e":"2026-10-19","m":"Clínica da Mulher"},{"n":163,"t":"Tela de Laudo — Simplificar preenchimento e utilizar laudo padrão parametrizado","d":"Remover as opções de preenchimento atuais da tela de laudo, mantendo só um campo de texto livre. Ao abrir, buscar e preencher o laudo padrão do procedimento (em branco se não houver), permitir editar e salvar sem alterar o modelo, e imprimir o texto final salvo pelo médico.","s":"Solucionado","p":"2026-10-14","e":"2026-10-20","m":"Clínica da Mulher"},{"n":164,"t":"Histórico do Paciente — Unificar atendimentos em ordem cronológica","d":"Reunir os atendimentos da APS, UPA e CAPS em uma única listagem, do mais recente para o mais antigo (data e horário), identificando a origem de cada um e mantendo as informações e funcionalidades de consulta atuais.","s":"Solucionado","p":"2026-10-14","e":"2026-10-20","m":"Secretaria de Saúde"},{"n":165,"t":"Recepção de Agendados — Cancelar recepção e devolver paciente à fila","d":"Adicionar botão \"Cancelar Recepção\" para pacientes já recepcionados; ao confirmar, o paciente volta para a fila de aguardando recepção, com listagem e status atualizados. O cancelamento é registrado no histórico, preservando a recepção original e o operador responsável.","s":"Solucionado","p":"2026-10-14","e":"2026-10-20","m":"Clínica da Mulher"},{"n":166,"t":"Pesquisa por Lote — Identificar produtos com estoque na unidade de login","d":"Na pesquisa por lote em Produtos, identificar o produto do lote e indicar \"Com estoque\" ou \"Sem estoque\" considerando somente o estoque da unidade de login, atualizado conforme as movimentações.","s":"Solucionado","p":"2026-10-14","e":"2026-10-20","m":"Farmácia e Almoxarifado"},{"n":167,"t":"Relatório de Pacientes Agendados — Adicionar filtro por horário","d":"Incluir no relatório campos de horário inicial e final para filtrar os agendamentos pelo horário previsto, combinável com os demais filtros, refletindo na listagem e na impressão.","s":"Solucionado","p":"2026-10-14","e":"2026-10-20","m":"Regulação"},{"n":168,"t":"Alocação de Transportes — Aumentar a fonte da Observação da Viagem no mapa","d":"Aumentar apenas a fonte do texto da \"Observação da Viagem\" no Mapa de Viagem, mantendo as demais fontes e o conteúdo da observação, para melhor leitura na visualização e na impressão.","s":"Solucionado","p":"2026-10-14","e":"2026-10-20","m":"Frotas"},{"n":169,"t":"Produtos — Identificar estoque disponível em outras unidades","d":"Manter a indicação de estoque na unidade de login e passar a mostrar, na listagem de Produtos, o nome das outras unidades que têm estoque do produto, ou \"Sem estoque em outras unidades\" quando não houver, com base no saldo real atualizado.","s":"Solucionado","p":"2026-10-14","e":"2026-10-20","m":"Farmácia e Almoxarifado"},{"n":170,"t":"Produtos — Adicionar filtro por disponibilidade de estoque","d":"Adicionar na tela de Produtos o filtro \"Estoque\" (Todos, Com estoque, Sem estoque), considerando o estoque da unidade de login, combinável com os demais filtros, com a listagem e a classificação atualizadas conforme as movimentações de estoque.","s":"Solucionado","p":"2026-10-16","e":"2026-10-20","m":"Farmácia e Almoxarifado"},{"n":171,"t":"Produção Clínica RAAS — Filtrar registros por mês","d":"Adicionar na tela de Produção Clínica RAAS um filtro de mês e ano, exibindo só os registros do período escolhido, de todos os profissionais da unidade, com possibilidade de trocar o período e mantendo as funcionalidades atuais da tela.","s":"Solucionado","p":"2026-10-16","e":"2026-10-20","m":"CAPS"},{"n":172,"t":"Produtos — Adicionar botão \"Ativar\" na listagem","d":"Incluir o botão \"Ativar\" ao lado do \"Inativar\" na listagem de Produtos: produtos ativos mantêm \"Inativar\" e inativos passam a ter \"Ativar\", alterando a situação direto pela listagem, após confirmação, sem abrir a edição e preservando histórico e movimentações.","s":"Solucionado","p":"2026-10-16","e":"2026-10-20","m":"Farmácia e Almoxarifado"},{"n":173,"t":"Alocação de Transportes — Identificar passageiros que necessitam de veículo separado","d":"Adicionar o campo \"Precisa de veículo separado?\" (Sim/Não), preenchido na inclusão do passageiro e editável depois, independente de \"Precisa de ambulância?\". Na organização das viagens, o passageiro com veículo separado não deve ser agrupado com outros.","s":"Solucionado","p":"2026-10-16","e":"2026-10-20","m":"Frotas"},{"n":174,"t":"Recepção de Agendados — Adicionar pesquisa por nome no campo Profissional","d":"No campo \"Profissional\" da Recepção de Agendados, permitir digitar o nome e filtrar as opções automaticamente conforme a digitação, selecionando entre os resultados. Ao limpar o campo, volta a lista completa, mantendo as regras e filtros atuais de disponibilidade.","s":"Solucionado","p":"2026-10-21","e":"2026-10-21","m":"Clínica da Mulher"},{"n":175,"t":"Impressão de Laudos — Verificar limite de imagens parametrizado","d":"Em um laudo com 9 fotos anexadas, apenas 3 saíram na impressão. Verificar o limite de imagens parametrizado e corrigir a configuração ou a rotina para imprimir todas as imagens do exame, sem cortes ou omissões.","s":"Pendente","p":"2026-10-21","e":"","m":"Clínica da Mulher"},{"n":176,"t":"Módulo de Frotas — Separar viagens e passageiros por unidade","d":"Vincular passageiros e viagens à unidade do login do operador, exibindo por padrão só os da unidade e impedindo a mistura entre unidades nas filas e na organização das viagens, preservando a separação entre transportes da zona urbana e rural.","s":"Pendente","p":"2026-10-21","e":"","m":"Frotas"},{"n":177,"t":"Módulo de Frotas — Identificar necessidade de cadeirinha infantil","d":"Adicionar na inclusão do passageiro o campo \"Necessita de cadeirinha infantil?\" (Sim/Não), exibido na listagem de passageiros e nos detalhes da viagem com destaque, vinculado ao passageiro e à viagem.","s":"Pendente","p":"2026-10-21","e":"","m":"Frotas"},{"n":178,"t":"Solicitações — Pesquisar pacientes pela data de nascimento","d":"Adicionar campo de pesquisa por data de nascimento na tela de Solicitação, listando os pacientes nascidos naquele dia, combinável com os filtros existentes e sem afetar as buscas por nome e CPF.","s":"Pendente","p":"2026-10-21","e":"","m":"Clínica da Mulher"},{"n":179,"t":"Renovação de Receitas — Exibir receitas próximas do vencimento","d":"Na tela de Renovação de Receitas, mostrar as receitas que vencem nos próximos 7 dias, considerando validade de 30 dias a partir da emissão no PEC, com paciente, data de emissão e data de vencimento, atualizando a listagem pelas datas.","s":"Pendente","p":"2026-10-21","e":"","m":"Secretaria de Saúde"},{"n":180,"t":"Alocação de Transportes — Ajustar regra de veículo separado","d":"Ajustar a regra para que o passageiro com \"Precisa de veículo separado?\" use um veículo diferente dos grupos incompatíveis, mas possa dividir o carro com outros passageiros (respeitando a capacidade), sem restringir a viagem ao paciente e acompanhantes. A opção de ambulância segue independente.","s":"Pendente","p":"2026-10-21","e":"","m":"Frotas"},{"n":181,"t":"Impressão de Laudos — Reduzir margens e evitar páginas desnecessárias","d":"Reduzir e ajustar as margens (superior, inferior e laterais) do laudo impresso para aproveitar melhor a página e evitar que a assinatura do médico vá para uma segunda página sem necessidade, sem cortes de texto, imagens ou assinatura.","s":"Pendente","p":"2026-10-21","e":"","m":"Clínica da Mulher"},{"n":182,"t":"Tela de Laudo — Formatação de texto e tamanho da fonte","d":"Adicionar ao campo do laudo as opções de Negrito e de aumentar e diminuir a fonte, aplicadas ao texto selecionado ou digitado, mantidas ao salvar, reabrir e imprimir, com a paginação ajustada em conjunto com a redução de margens.","s":"Pendente","p":"2026-10-21","e":"","m":"Clínica da Mulher"}]}</script>
<script id="code">
const $=s=>document.querySelector(s),fm=s=>s?s.split('-').reverse().join('/'):'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL={'Solucionado':'#27ae60','Pendente':'#f39c12','Em análise':'#3498db'};
const stt=v=>/^pend/i.test(v)?'Pendente':/an[aá]lise/i.test(v)?'Em análise':/solu/i.test(v)?'Solucionado':'';
const ser=v=>{if(v===''||v==null)return '';if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
 const a=String(v).match(/(\d{2})\/(\d{2})\/(\d{4})/);if(a)return a[3]+'-'+a[2]+'-'+a[1];const b=String(v).match(/^\d{4}-\d{2}-\d{2}/);return b?b[0]:''};
const dd=r=>r.s==='Solucionado'&&r.p&&r.e?Math.round((Date.parse(r.e)-Date.parse(r.p))/864e5):null;
let D,CH=[];const BL=JSON.parse($('#dados').textContent);
function render(){
 CH.forEach(c=>c.destroy());CH=[];
 const R=D.rows,n=s=>R.filter(r=>r.s===s).length,tot=R.length,sol=n('Solucionado'),pen=n('Pendente'),ana=n('Em análise');
 const ds=R.map(dd).filter(x=>x!==null&&x>=0).sort((a,b)=>a-b),L=ds.length;
 const med=L?(L%2?ds[(L-1)/2]:(ds[L/2-1]+ds[L/2])/2):0,avg=L?ds.reduce((a,b)=>a+b,0)/L:0;
 const f1=x=>x.toFixed(1).replace('.',',');
 const k=(v,l,c)=>`<div class="k" style="border-top-color:${c||'var(--dk)'}"><b style="color:${c||'inherit'}">${v}</b><span>${l}</span></div>`;
 $('#upd').textContent='Atualizado em '+fm(D.upd);
 $('#app').innerHTML=`<div class="kpis">${k(tot,'Total')}${k(sol,'Solucionadas','#27ae60')}${k(pen,'Pendentes','#f39c12')}${k(ana,'Em análise','#3498db')}${k(tot?f1(sol/tot*100)+'%':'0%','Resolvidas')}${k(f1(avg),'Tempo médio (dias)')}${k(f1(med),'Tempo mediano (dias)')}</div>
 <div class="grid"><div class="c"><h2>Status</h2><div><canvas id="c1"></canvas></div></div><div class="c"><h2>Demandas por módulo</h2><div><canvas id="c2"></canvas></div></div><div class="c"><h2>Pedidas x entregues por mês</h2><div><canvas id="c3"></canvas></div></div><div class="c"><h2>Tempo de entrega (dias)</h2><div><canvas id="c4"></canvas></div></div></div>
 <div class="f"><input id="q" placeholder="Buscar por número, título ou descrição"><select id="fs"><option value="">Todos os status</option>${Object.keys(COL).map(s=>`<option>${s}</option>`).join('')}</select><select id="fm"><option value="">Todos os módulos</option>${D.mods.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div>
 <p id="cnt"></p><div class="t"><table><thead><tr><th>Nº</th><th>Demanda</th><th>Módulo</th><th>Status</th><th>Pedido</th><th>Entrega</th><th>Dias</th></tr></thead><tbody id="tb"></tbody></table></div>`;
 Chart.defaults.color=getComputedStyle(document.documentElement).getPropertyValue('--mu').trim()||'#7f8c8d';
 const mk=(id,cfg)=>{cfg.options=Object.assign({responsive:true,maintainAspectRatio:false},cfg.options);CH.push(new Chart($(id),cfg))};
 mk('#c1',{type:'doughnut',data:{labels:Object.keys(COL),datasets:[{data:[sol,pen,ana],backgroundColor:Object.values(COL),borderWidth:0}]},options:{plugins:{legend:{position:'right'}}}});
 mk('#c2',{type:'bar',data:{labels:D.mods,datasets:Object.keys(COL).map(s=>({label:s,data:D.mods.map(m=>R.filter(r=>r.m===m&&r.s===s).length),backgroundColor:COL[s]}))},options:{indexAxis:'y',scales:{x:{stacked:true},y:{stacked:true}},plugins:{legend:{position:'bottom'}}}});
 const ks=[...R.map(r=>r.p),...R.map(r=>r.e)].filter(Boolean).map(x=>x.slice(0,7)).sort(),ms=[];
 if(ks.length){let [y,m]=ks[0].split('-').map(Number);const [y2,m2]=ks[ks.length-1].split('-').map(Number);while(y<y2||(y===y2&&m<=m2)){ms.push(y+'-'+String(m).padStart(2,'0'));if(++m>12){m=1;y++}}}
 const cm=(a,q)=>R.filter(r=>r[a]&&r[a].slice(0,7)===q).length;
 mk('#c3',{type:'bar',data:{labels:ms.map(q=>q.slice(5)+'/'+q.slice(0,4)),datasets:[{label:'Pedidas',data:ms.map(q=>cm('p',q)),backgroundColor:'#5d7a96'},{label:'Entregues',data:ms.map(q=>cm('e',q)),backgroundColor:'#27ae60'}]},options:{plugins:{legend:{position:'bottom'}}}});
 const B=[['Mesmo dia',0,0],['1 dia',1,1],['2 a 3',2,3],['4 a 7',4,7],['8 a 30',8,30],['Mais de 30',31,1e9]];
 mk('#c4',{type:'bar',data:{labels:B.map(b=>b[0]),datasets:[{label:'Demandas',data:B.map(b=>ds.filter(x=>x>=b[1]&&x<=b[2]).length),backgroundColor:'#3498db'}]},options:{plugins:{legend:{display:false}}}});
 const draw=()=>{const q=$('#q').value.toLowerCase(),s=$('#fs').value,m=$('#fm').value;
  const T=[...R].sort((a,b)=>b.n-a.n).filter(r=>(!s||r.s===s)&&(!m||r.m===m)&&(!q||(r.n+' '+r.t+' '+r.d).toLowerCase().includes(q)));
  $('#cnt').textContent=T.length+' de '+tot+' demandas';
  $('#tb').innerHTML=T.map(r=>{const d=dd(r);return `<tr><td>${r.n}</td><td><b>${esc(r.t)}</b><div class="d">${esc(r.d)}</div></td><td>${esc(r.m)}</td><td><span class="s" style="background:${COL[r.s]||'#7f8c8d'}">${esc(r.s)}</span></td><td>${fm(r.p)}</td><td>${fm(r.e)}</td><td>${d===null?'':d}</td></tr>`}).join('')};
 ['#q','#fs','#fm'].forEach(i=>$(i).addEventListener('input',draw));
 $('#tb').addEventListener('click',e=>{const t=e.target.closest('tr');if(t)t.classList.toggle('o')});
 draw();
}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(cred){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(cred),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BL.s),iterations:BL.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BL.i)},key,b64(BL.c));
 D=JSON.parse(new TextDecoder().decode(pt));document.body.classList.remove('locked');render();
}
$('#lf').addEventListener('submit',async e=>{e.preventDefault();
 const c=$('#u').value.trim().toLowerCase()+':'+$('#p').value;
 if(!(window.crypto&&crypto.subtle)){$('#err').textContent='Abra o site por HTTPS para entrar.';return}
 try{await unlock(c);try{sessionStorage.setItem('k',c)}catch(x){}}catch(x){$('#err').textContent='Usuário ou senha incorretos.';$('#p').value=''}});
try{const k0=sessionStorage.getItem('k');if(k0&&window.crypto&&crypto.subtle)unlock(k0).catch(()=>sessionStorage.removeItem('k'))}catch(x){}
</script>
</body></html>
